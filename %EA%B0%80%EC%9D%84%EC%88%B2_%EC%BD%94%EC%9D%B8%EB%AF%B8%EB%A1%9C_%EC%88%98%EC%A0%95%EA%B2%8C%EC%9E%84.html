<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가을 숲 코인 미로</title><style>body{font-family:sans-serif;text-align:center;background:#fff2db;color:#49372c}button{border:0;border-radius:14px;padding:12px 18px;margin:5px;background:#f5bd74;font-size:20px;touch-action:none}canvas{width:96vw;max-width:1000px;border:5px solid #a77a52;border-radius:18px;touch-action:none;background:#e7f3d9}#wrap{position:relative;width:min(98vw,1010px);margin:auto}#over{position:absolute;inset:5px;background:#fff8e8eb;display:flex;justify-content:center;align-items:center}#panel{background:white;padding:18px;border-radius:20px;max-width:85%;max-height:95%;overflow:auto}#panel button{display:inline-block}#panel .ans{display:block;width:95%}#controls button{background:#a9dce7}h1{margin:8px}</style><h1>🍁 가을 숲 코인 대모험 🐶🐱</h1><div><b id="stats">🪙 0점　❤️❤️❤️　⏱ 60초</b> <button id="mute">🔊</button><button id="reset">↻ 처음으로</button></div><div id="wrap"><canvas id="c" width="1000" height="570"></canvas><div id="over"><div id="panel"></div></div></div><div id="controls"><button data-d="l">⬅</button><button data-d="u">⬆</button><button data-d="d">⬇</button><button data-d="r">➡</button></div><p>터치 또는 방향키로 이동 · 인터넷 없이 실행 가능</p><script>
let c=document.querySelector('#c'),g=c.getContext('2d'),over=document.querySelector('#over'),panel=document.querySelector('#panel'),animal='dog',sound=true,play=false,score=0,hp=3,time=60,items=[],key={},last=0,spawn=0,walk=0,inv=0,net=0,raf,qi=0;let x=65,y=500;const walls=[[0,0,1000,15],[0,555,1000,15],[0,0,15,570],[985,0,15,570],[165,90,24,380],[325,15,24,345],[485,210,24,345],[645,15,24,345],[805,210,24,345]];const qs=[['가을에 나뭇잎이 빨갛고 노랗게 변하는 현상은?',['단풍','개화','발아'],0,'나뭇잎이 붉고 노랗게 물드는 현상을 단풍이라고 해요.'],['가을에 익는 열매는 무엇일까요?',['밤','수박','딸기'],0,'밤은 가을에 익는 대표적인 열매예요.'],['가을이 깊어지면 낮의 길이는?',['더 길어져요','더 짧아져요','똑같아요'],1,'가을에는 낮이 점점 짧아져요.']];let audio;
function beep(f,d=.13,delay=0,type='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(70,f*.65),t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.11,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function coin(){beep(820,.1);beep(1200,.17,.1);if(animal==='dog'){beep(350,.15,.25,'triangle');beep(290,.17,.4,'triangle')}else{beep(750,.18,.25);beep(1050,.2,.42)}}
function home(){panel.innerHTML='<h2>🍁 가을 숲으로 출발!</h2><p>캐릭터를 골라요!</p><button data-p="dog">🐶 강아지</button><button data-p="cat">🐱 고양이</button><p>❤️ 하트를 누르면 가을 퀴즈 3문제가 나와요!</p><button id="quiz">❤️ 가을 퀴즈</button><p>🪙 숫자 동전을 모으고 💣 폭탄을 피하세요!</p><button id="start">▶ 게임 시작</button>'}
function question(){let q=qs[qi];panel.innerHTML='<h2>❤️ 가을 퀴즈 '+(qi+1)+'/3</h2><h3>'+q[0]+'</h3>'+q[1].map((a,i)=>'<button class="ans" data-a="'+i+'">'+a+'</button>').join('')}
function answer(n){let q=qs[qi];beep(n===q[2]?900:260);panel.innerHTML='<h2>'+(n===q[2]?'🌟 정답!':'🌱 배워 보아요!')+'</h2><p>'+q[3]+'</p><button id="next">'+(qi===2?'게임으로 가기':'다음 문제')+'</button>'}
function reset(){cancelAnimationFrame(raf);play=false;score=0;hp=3;time=60;items=[];key={};last=0;spawn=0;walk=0;inv=0;net=0;x=65;y=500;over.style.display='flex';home();hud();draw()}
function hud(){document.querySelector('#stats').textContent='🪙 '+score+'점　'+'❤️'.repeat(hp)+'🤍'.repeat(3-hp)+'　⏱ '+Math.ceil(time)+'초'}
function hit(a,b,r){return walls.some(w=>a+r>w[0]&&a-r<w[0]+w[2]&&b+r>w[1]&&b-r<w[1]+w[3])}
function start(){play=true;over.style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}
function end(lost){play=false;if(lost){net=0;last=performance.now();raf=requestAnimationFrame(drop)}else{draw(true);beep(550,.25);beep(770,.25,.15);finish(false)}}
function drop(t){let dt=Math.min(.05,(t-last)/1000);last=t;net=Math.min(1,net+dt*1.2);draw();if(net<1)raf=requestAnimationFrame(drop);else finish(true)}
function finish(lost){over.style.display='flex';panel.innerHTML=(lost?'<h2>🕸️ 그물이 내려왔어요!</h2><p>다시 도전해 보아요!</p>':'<h2>🌈 무지개가 떴어요! 🌈</h2><p>가을 숲 탐험 성공!</p>')+'<h2>🪙 '+score+'점</h2><button id="again">↻ 다시 도전</button>'}
function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;time-=dt;if(time<=0){time=0;hud();end(false);return}spawn+=dt;walk+=dt;inv=Math.max(0,inv-dt);let dx=(key.r?1:0)-(key.l?1:0),dy=(key.d?1:0)-(key.u?1:0);if(dx||dy){let n=Math.hypot(dx,dy),nx=x+dx/n*230*dt,ny=y+dy/n*230*dt;if(!hit(nx,y,22))x=nx;if(!hit(x,ny,22))y=ny;if(walk>.18){beep(260,.035,0,'triangle');walk=0}}if(spawn>.55){spawn=0;let co=Math.random()<.65;items.push({x:35+Math.random()*930,y:-25,coin:co,value:1+Math.floor(Math.random()*20),v:90+Math.random()*60})}for(let i=items.length-1;i>=0;i--){let a=items[i];a.y+=a.v*dt;if(a.y>590){items.splice(i,1);continue}if(Math.hypot(x-a.x,y-a.y)<39){if(a.coin){score+=a.value;coin();items.splice(i,1)}else if(inv<=0){hp--;inv=1.3;beep(140,.42,0,'sawtooth');items.splice(i,1);if(hp<=0){hud();end(true);return}}}}hud();draw();raf=requestAnimationFrame(loop)}
function circle(a,b,r,color){g.fillStyle=color;g.beginPath();g.arc(a,b,r,0,Math.PI*2);g.fill()}
function draw(rainbow=false){g.clearRect(0,0,1000,570);let grad=g.createLinearGradient(0,0,0,570);grad.addColorStop(0,'#dceef3');grad.addColorStop(1,'#f7e6bf');g.fillStyle=grad;g.fillRect(0,0,1000,570);g.font='27px serif';g.globalAlpha=.32;for(let yy=50;yy<550;yy+=90)for(let xx=40;xx<980;xx+=110)g.fillText((xx+yy)%3?'🍁':'🍂',xx,yy);g.globalAlpha=1;walls.forEach(w=>{g.fillStyle='#956943';g.fillRect(...w);g.fillStyle='#d5a474';g.fillRect(w[0]+4,w[1]+4,Math.max(0,w[2]-8),Math.max(0,w[3]-8))});for(let a of items){if(a.coin){circle(a.x,a.y,21,'#b67812');circle(a.x,a.y,18,'#f6ca50');g.strokeStyle='#fff2ad';g.lineWidth=2;g.beginPath();g.arc(a.x,a.y,14,0,Math.PI*2);g.stroke();g.fillStyle='#68410f';g.textAlign='center';g.font='bold 19px sans-serif';g.fillText(a.value,a.x,a.y+6)}else{circle(a.x,a.y,20,'#333740');circle(a.x-7,a.y-7,5,'#777d84');g.strokeStyle='#71502e';g.lineWidth=5;g.beginPath();g.moveTo(a.x+8,a.y-15);g.lineTo(a.x+16,a.y-27);g.stroke();g.font='23px serif';g.fillText('✴',a.x+16,a.y-24)}}if(!(inv>0&&Math.floor(inv*8)%2===0)){g.save();g.translate(x,y);let dog=animal==='dog',fur=dog?'#f3c58c':'#f5d9c7';if(dog){circle(-22,-15,14,'#9c6844');circle(22,-15,14,'#9c6844')}else{g.fillStyle=fur;g.beginPath();g.moveTo(-25,-7);g.lineTo(-22,-36);g.lineTo(-5,-25);g.lineTo(5,-25);g.lineTo(22,-36);g.lineTo(25,-7);g.fill()}circle(0,0,28,fur);circle(-10,-4,3.7,'#40342e');circle(10,-4,3.7,'#40342e');circle(-18,10,5,'#efa4a0');circle(18,10,5,'#efa4a0');circle(0,8,4,'#80534c');g.strokeStyle='#80534c';g.lineWidth=2;g.beginPath();g.moveTo(0,11);g.quadraticCurveTo(-7,19,-12,13);g.moveTo(0,11);g.quadraticCurveTo(7,19,12,13);g.stroke();if(!dog){g.beginPath();g.moveTo(-13,12);g.lineTo(-30,9);g.moveTo(13,12);g.lineTo(30,9);g.stroke()}g.restore()}if(rainbow){['#e65b58','#eea24e','#f6d957','#74b976','#69b9d5','#9580ce'].forEach((co,i)=>{g.strokeStyle=co;g.lineWidth=11;g.beginPath();g.arc(500,550,250-i*14,Math.PI,2*Math.PI);g.stroke()})}if(net>0){let b=-560+net*1130;g.strokeStyle='#6d8588';g.lineWidth=3;for(let xx=-600;xx<1600;xx+=34){g.beginPath();g.moveTo(xx,b-620);g.lineTo(xx+620,b);g.moveTo(xx,b);g.lineTo(xx+620,b-620);g.stroke()}}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.p){animal=b.dataset.p;home()}if(b.id==='quiz'){qi=0;question()}if(b.dataset.a!==undefined)answer(+b.dataset.a);if(b.id==='next'){qi++;if(qi>=3)home();else question()}if(b.id==='start')start();if(b.id==='reset'||b.id==='again')reset();if(b.id==='mute'){sound=!sound;b.textContent=sound?'🔊':'🔇'}});document.querySelectorAll('[data-d]').forEach(b=>{let d=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();key[d]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>key[d]=false))});document.addEventListener('keydown',e=>{let d={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(d){e.preventDefault();key[d]=true}});document.addEventListener('keyup',e=>{let d={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(d)key[d]=false});window.addEventListener('blur',()=>key={});reset();
</script></html>
